<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Pass/Fail Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h1>Student Success Predictor</h1>
            <p>Enter your daily study hours to predict your exam outcome.</p>
            
            <div class="input-group">
                <input type="number" id="studyHours" placeholder="e.g., 5.5" min="0" max="24" step="0.1">
                <label for="studyHours">Study Hours / Day</label>
            </div>

            <button onclick="predictResult()">Predict Outcome</button>

            <div id="result" class="result-container hidden">
                <h2>Prediction: <span id="predictionText">--</span></h2>
                <p>Probability: <span id="probabilityText">--</span>%</p>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
